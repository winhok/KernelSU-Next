name: S918B DYI3 pinned Manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ksud:
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ubuntu-latest
      pack_lkm: false
      pack_ksuinit: false

  build-manager:
    needs: build-ksud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout pinned source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify source commit
        run: |
          pinned="032b799f2a4dbd2235fc462cadacbdfd7bffef33"
          git merge-base --is-ancestor "$pinned" HEAD
          test "$(git diff --name-only "$pinned" HEAD)" = ".github/workflows/s918b-dyi3-manager.yml"
        working-directory: .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download arm64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-aarch64-linux-android
          path: aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-x86_64-linux-android
          path: x86_64-linux-android

      - name: Embed matching ksud binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cp ../aarch64-linux-android/aarch64-linux-android/release/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          cp ../x86_64-linux-android/x86_64-linux-android/release/ksud app/src/main/jniLibs/x86_64/libksud.so

      - name: Build release Manager
        run: ./gradlew clean assembleRelease

      - name: Record source and hashes
        run: |
          mkdir -p release
          git -C .. rev-parse HEAD > release/SOURCE_COMMIT.txt
          sha256sum app/build/outputs/apk/release/*.apk > release/SHA256SUMS
          cp app/build/outputs/apk/release/*.apk release/

      - name: Upload pinned Manager
        uses: actions/upload-artifact@v5
        with:
          name: KernelSU-Next-S918B-DYI3-pinned-Manager
          path: manager/release/
          if-no-files-found: error
